name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser:
        description: Also run the Playwright suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # server.test.mjs asserts the production HTML and compression contract,
      # so dist/ has to exist before the node suite runs.
      - run: npm run build
      - run: npm test

  # GitHub runners have no GPU, so Chromium software-renders through
  # SwiftShader. The 1440x900 desktop project then misses the assisted-flight
  # and streaming budgets while the 390x844 phone project passes — a property
  # of the runner, not of the site. Rather than pad timeouts until a flaky job
  # looks green, the browser suite stays a local pre-deploy gate and can be
  # dispatched here on demand. Run `npm run test:browser` before shipping.
  browser:
    if: inputs.browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
