# Builds and publishes the container image. Deployment itself stays in the
# private GitOps repository: this workflow prints the digest to pin, and a human
# commits it there. Nothing here knows a cluster address, and nothing here can
# reach one.
#
# The predecessor of this file called a reusable workflow in a private repo in
# another organisation. GitHub refused to resolve it, every push-triggered run
# failed at 0s, and images were built by hand for months. This workflow is
# self-contained on purpose.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          # The cluster is amd64. Building one architecture keeps the job short
          # and the image honest about where it runs.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/giovanni-dev-br-public:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/giovanni-dev-br-public:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report the pin
        run: |
          {
            echo '## Pin this in GitOps'
            echo
            echo '`apps/giovanni-dev-br/values-prod.yaml`:'
            echo
            echo '```yaml'
            echo 'image:'
            echo '  repository: ghcr.io/${{ github.repository_owner }}/giovanni-dev-br-public'
            echo '  tag: "${{ github.sha }}"'
            echo '  digest: "${{ steps.build.outputs.digest }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
